<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ambil PDF gratisnya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="funnel.css">
</head>
<body>
<div class="wrap">

  <div class="brand">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" stroke="#C9A227" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 8 L50 50 M50 50 L88 30 M50 50 L12 30" stroke="#C9A227" stroke-width="2.5" stroke-linejoin="round" opacity=".55"/>
      <path d="M50 50 L50 92" stroke="#C9A227" stroke-width="2.5" opacity=".35"/>
      <path d="M50 8 L88 30 L50 50 L12 30 Z" fill="#C9A227" opacity=".08"/>
    </svg>
    <div class="brand-name">NYCHO<span>THESIS</span></div>
  </div>

  <h1>Isi ini, PDF-nya <em>langsung dikirim</em>.</h1>
  <p class="sub">Gratis. Ga ada syarat lain, ga ada spam. Gw kirim ke email lu dalam beberapa menit.</p>

  <div class="panel">
    <form id="optin-form" novalidate>
      <div class="field">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="field_1" placeholder="nama lu" required>
      </div>
      <div class="field">
        <label for="email">Email aktif</label>
        <input type="email" id="email" name="field_0" placeholder="email@lu.com" required>
      </div>
      <div class="field">
        <label for="wa">Nomor WhatsApp</label>
        <input type="tel" id="wa" name="field_4" inputmode="numeric" autocomplete="tel" placeholder="08xxxxxxxxxx" required>
      </div>
      <input type="text" name="hpc4b27b6e-eb38-11e9-be00-06b4694bee2a" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <button type="submit" class="btn-primary" id="submit-btn">Kirim PDF-nya ke gw</button>
      <p class="err" id="err" hidden></p>
      <p class="micro">Email lu cuma gw pake buat ngirim PDF dan insight lanjutan. Bisa berhenti kapan aja.</p>
    </form>
  </div>

</div>

<script>
  (function () {
    var ENDPOINT = 'https://eocampaign1.com/form/d55e6cce-8a68-11f1-9ee5-27fb991eb42d';
    var SUKSES = 'index.html?oto=1';

    var form = document.getElementById('optin-form');
    var btn = document.getElementById('submit-btn');
    var err = document.getElementById('err');
    var labelAsli = btn.textContent;

    function tampilError(pesan) {
      err.textContent = pesan;
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = labelAsli;
    }

    // Rapihin nomor jadi format 62xxxxxxxxxx (tanpa +, spasi, strip).
    function rapihinNomor(mentah) {
      var s = String(mentah).replace(/[\s\-\.\(\)]/g, '');
      if (s.charAt(0) === '+') s = s.slice(1);
      if (s.charAt(0) === '0') s = '62' + s.slice(1);
      else if (s.charAt(0) === '8') s = '62' + s;
      return s;
    }

    // Nomor HP Indonesia: 62 + 8 + operator + sisanya. Total 11 sampai 14 digit.
    function nomorValid(s) {
      return /^628[1-9][0-9]{7,10}$/.test(s);
    }

    function emailValid(s) {
      return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(s);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.hidden = true;

      if (!form.nama.value.trim() || !form.email.value.trim() || !form.wa.value.trim()) {
        tampilError('Isi dulu semua kolomnya ya.');
        return;
      }

      if (!emailValid(form.email.value.trim())) {
        tampilError('Emailnya kayaknya salah ketik. Cek lagi ya.');
        return;
      }

      var nomor = rapihinNomor(form.wa.value);
      if (!nomorValid(nomor)) {
        tampilError('Nomor WhatsApp-nya belum bener. Contoh: 081234567890');
        return;
      }
      form.wa.value = nomor;

      btn.disabled = true;
      btn.textContent = 'Lagi ngirim...';

      var data = new URLSearchParams(new FormData(form));

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data
      }).then(function (res) {
        if (res.ok) { window.location.href = SUKSES; return null; }
        return res.json().catch(function () { return null; });
      }).then(function (j) {
        if (j === null) return;
        var pesan = (j && j.error && j.error.message) || 'Gagal ngirim. Coba lagi bentar.';
        tampilError(pesan);
      }).catch(function () {
        tampilError('Koneksinya bermasalah. Coba lagi bentar.');
      });
    });
  })();
</script>
</body>
</html>
