<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ambil PDF gratisnya</title>
<!-- Font yang kepake di layar pertama diminta duluan, biar ga nunggu
     fonts.css selesai diunduh. crossorigin WAJIB ada walaupun file-nya
     seserver; tanpa itu font-nya malah keunduh dua kali. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-900.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-700.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/atkinson-400.woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="funnel.css">

<!-- Google Analytics 4. Ditaro di ujung <head> biar ga rebutan jatah unduhan
     sama font yang dipreload di atas. Lihat catatan lengkapnya di homepage. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FFND4PK6SC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-FFND4PK6SC');
</script>
</head>
<body>
<div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i></div>

<div class="wrap">

  <div class="brand">
    <img src="assets/logo.svg" alt="" width="34" height="34">
    <div class="brand-name">NYCHO<span>THESIS</span></div>
  </div>

  <h1>Isi ini, PDF-nya <em>langsung dikirim</em>.</h1>
  <p class="sub">Gratis. Gw kirim ke email lu dalam beberapa menit.</p>

  <div class="panel">
    <!-- PENTING: tiap kolom WAJIB punya autocomplete yang bener.
       Tanpa itu, iOS/Safari nebak sendiri dari urutan sama nama field. Karena
       name-nya "field_1"/"field_0" (kode EmailOctopus, ga ada artinya buat
       browser), tebakannya meleset dan email malah masuk ke kolom Nama,
       sementara nama masuk ke kolom Email. Orang yang autofill jadi kena
       error "emailnya salah ketik" padahal dia ga salah apa-apa. -->
    <form id="optin-form" novalidate>
      <div class="field">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="field_1" placeholder="nama lu" required
               autocomplete="name" autocapitalize="words" spellcheck="false">
      </div>
      <div class="field">
        <label for="email">Email aktif</label>
        <input type="email" id="email" name="field_0" placeholder="email@lu.com" required
               autocomplete="email" inputmode="email"
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="wa">Nomor WhatsApp</label>
        <input type="tel" id="wa" name="field_4" inputmode="numeric" autocomplete="tel" placeholder="08xxxxxxxxxx" required>
      </div>
      <input type="text" name="hpc4b27b6e-eb38-11e9-be00-06b4694bee2a" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <button type="submit" class="btn-primary" id="submit-btn">Kirim PDF-nya ke gw</button>
      <p class="err" id="err" hidden></p>
      <p class="micro">Email lu cuma gw pake buat ngirim PDF dan insight lanjutan. Bisa berhenti kapan aja.</p>
    </form>
  </div>

</div>

<script>
  (function () {
    var ENDPOINT = 'https://eocampaign1.com/form/d55e6cce-8a68-11f1-9ee5-27fb991eb42d';
    var SUKSES = 'index.html?oto=1';

    var form = document.getElementById('optin-form');
    var btn = document.getElementById('submit-btn');
    var err = document.getElementById('err');
    var labelAsli = btn.textContent;

    function tampilError(pesan) {
      err.textContent = pesan;
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = labelAsli;
    }

    // Samain ke format 08xxxxxxxxxx, ngikutin data yang udah ada di list.
    function rapihinNomor(mentah) {
      var s = String(mentah).replace(/[\s\-\.\(\)]/g, '');
      if (s.charAt(0) === '+') s = s.slice(1);
      if (s.slice(0, 2) === '62') s = '0' + s.slice(2);
      else if (s.charAt(0) === '8') s = '0' + s;
      return s;
    }

    // Nomor HP Indonesia: 08 + operator + sisanya. Total 10 sampai 13 digit.
    function nomorValid(s) {
      return /^08[1-9][0-9]{7,10}$/.test(s);
    }

    function emailValid(s) {
      return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(s);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.hidden = true;

      if (!form.nama.value.trim() || !form.email.value.trim() || !form.wa.value.trim()) {
        tampilError('Isi dulu semua kolomnya ya.');
        return;
      }

      // Jaring pengaman buat autofill yang naro isian di kolom yang salah.
      // Atribut autocomplete di HTML-nya udah dibenerin, tapi tiap browser
      // punya tebakan sendiri dan ga ada yang bisa dipaksa 100%. Jadi kalo
      // kolom Email isinya BUKAN email tapi kolom Nama isinya JUSTRU email,
      // udah pasti ketuker. Tuker balik diem-diem: orang cuma pengen PDF-nya,
      // dia ga peduli kotak mana yang bener, dan nyuruh dia benerin sendiri
      // cuma bikin dia nutup halaman.
      // Syaratnya sengaja ketat (dua-duanya harus kepenuhan) biar ga ada
      // isian bener yang malah dituker.
      var isiNama = form.nama.value.trim();
      var isiEmail = form.email.value.trim();
      if (!emailValid(isiEmail) && emailValid(isiNama)) {
        form.nama.value = isiEmail;
        form.email.value = isiNama;
      }

      if (!emailValid(form.email.value.trim())) {
        tampilError('Emailnya kayaknya salah ketik. Cek lagi ya.');
        return;
      }

      var nomor = rapihinNomor(form.wa.value);
      if (!nomorValid(nomor)) {
        tampilError('Nomor WhatsApp-nya belum bener. Contoh: 08123456789');
        return;
      }
      form.wa.value = nomor;

      btn.disabled = true;
      btn.textContent = 'Lagi ngirim...';

      var data = new URLSearchParams(new FormData(form));

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data
      }).then(function (res) {
        if (res.ok) { window.location.href = SUKSES; return null; }
        return res.json().catch(function () { return null; });
      }).then(function (j) {
        if (j === null) return;
        var pesan = (j && j.error && j.error.message) || 'Gagal ngirim. Coba lagi bentar.';
        tampilError(pesan);
      }).catch(function () {
        tampilError('Koneksinya bermasalah. Coba lagi bentar.');
      });
    });
  })();
</script>
</body>
</html>
